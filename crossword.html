<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Crossword 🎂</title>
  <style>
    :root {
      --bg-color: #121212;
      --grid-bg: #2a2a2a;
      --cell-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #ff6b81;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    .crossword-container {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      overflow-x: auto;
      max-width: 100%;
    }

    /* 18 columns x 14 rows Grid Layout */
    .crossword-grid {
      display: grid;
      grid-template-columns: repeat(18, 34px);
      grid-template-rows: repeat(14, 34px);
      gap: 2px;
      background-color: var(--grid-bg);
      border: 2px solid var(--grid-bg);
      border-radius: 4px;
    }

    .cell {
      width: 34px;
      height: 34px;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      border: none;
      background-color: var(--cell-bg);
      color: var(--text-color);
      outline: none;
      transition: background-color 0.2s ease;
    }

    .cell:focus {
      background-color: #e0f7fa;
      box-shadow: inset 0 0 0 2px var(--accent-color);
    }

    .cell.blocked {
      background-color: #181818;
      pointer-events: none;
    }

    .cell.correct {
      background-color: #c8e6c9 !important;
    }

    .cell.incorrect {
      background-color: #ffcdd2 !important;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    button:hover {
      background-color: #ff4757;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <h1>🎂 Birthday Crossword Puzzle 🎂</h1>

  <div class="crossword-container">
    <div class="crossword-grid" id="grid"></div>
  </div>

  <div class="controls">
    <button onclick="checkAnswers()">Check Answers</button>
  </div>

  <script>
    const rows = 14;
    const cols = 18;

    // Grid Mapping: Row index 0-13, Col index 0-17
    const layout = [
      // Row 1 (Index 0)
      "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "",
      // Row 2 (Index 1)
      "", "", "", "", "", "", "", "", "", "S", "", "", "", "", "", "", "", "",
      // Row 3 (Index 2)
      "", "", "", "", "", "", "", "", "", "U", "", "", "", "", "", "", "", "",
      // Row 4 (Index 3)
      "", "S", "A", "B", "K", "U", "C", "H", "", "G", "", "", "", "", "", "", "", "",
      // Row 5 (Index 4)
      "", "U", "", "", "", "", "", "A", "", "A", "", "", "", "", "", "", "", "",
      // Row 6 (Index 5)
      "", "P", "E", "A", "K", "", "", "A", "E", "R", "O", "D", "Y", "N", "A", "M", "I", "C",
      // Row 7 (Index 6)
      "", "", "", "", "I", "", "", "N", "", "", "", "", "", "", "", "", "", "",
      // Row 8 (Index 7)
      "", "", "", "", "K", "", "", "K", "", "", "", "", "", "", "", "", "", "",
      // Row 9 (Index 8)
      "W", "E", "E", "W", "O", "O", "", "H", "", "", "", "", "", "", "", "", "", "",
      // Row 10 (Index 9)
      "", "", "", "", "", "", "", "Y", "", "", "", "", "", "", "", "", "", "",
      // Row 11 (Index 10)
      "", "", "", "", "", "", "Y", "H", "A", "R", "", "", "", "", "", "", "", "",
      // Row 12 (Index 11)
      "", "", "", "", "", "", "H", "A", "A", "J", "I", "", "", "", "", "", "", "",
      // Row 13 (Index 12)
      "", "", "", "", "", "", "E", "N", "R", "E", "V", "'", "A", "A", "V", "A", "Y", "",
      // Row 14 (Index 13)
      "", "", "", "", "", "", "", "", "D", "A", "", "", "", "", "", "", "", ""
    ];

    const gridElement = document.getElementById('grid');

    // Render cells
    layout.forEach((char, index) => {
      const input = document.createElement('input');
      input.classList.add('cell');
      
      if (char === "") {
        input.classList.add('blocked');
        input.tabIndex = -1;
      } else {
        input.maxLength = 1;
        input.dataset.answer = char;
        
        // Auto-advance cursor to next playable input on keydown
        input.addEventListener('input', (e) => {
          if (e.target.value.length === 1) {
            let next = input.nextElementSibling;
            while (next && next.classList.contains('blocked')) {
              next = next.nextElementSibling;
            }
            if (next) next.focus();
          }
        });
      }
      
      gridElement.appendChild(input);
    });

    function checkAnswers() {
      const inputs = document.querySelectorAll('.cell:not(.blocked)');
      inputs.forEach(input => {
        const userVal = input.value.trim().toUpperCase();
        const correctVal = input.dataset.answer.toUpperCase();
        
        if (userVal === correctVal) {
          input.classList.add('correct');
          input.classList.remove('incorrect');
        } else if (userVal !== "") {
          input.classList.add('incorrect');
          input.classList.remove('correct');
        }
      });
    }
  </script>
</body>
</html>
