<script>
        const wordList = [
            { id: 'd2', word: 'SUGAR', cells: [[1,9],[2,9],[3,9],[4,9],[5,9]] },                       // J2:J6
            { id: 'a1', word: 'SABKUCH', cells: [[3,1],[3,2],[3,3],[3,4],[3,5],[3,6],[3,7]] },          // B4:H4
            { id: 'd4', word: 'SUP', cells: [[3,1],[4,1],[5,1]] },                                      // B4:B6
            { id: 'a3', word: 'PEAK', cells: [[5,1],[5,2],[5,3],[5,4]] },                               // B6:E6
            { id: 'd5', word: 'KIKO', cells: [[5,4],[6,4],[7,4],[8,4]] },                               // E6:E9
            { id: 'd7', word: 'HAANKYHAAN', cells: [[3,7],[4,7],[5,7],[6,7],[7,7],[8,7],[9,7],[10,7],[11,7],[12,7]] }, // H4:H13
            { id: 'a5', word: 'AERODYNAMIC', cells: [[5,7],[5,8],[5,9],[5,10],[5,11],[5,12],[5,13],[5,14],[5,15],[5,16],[5,17]] }, // H6:R6
            { id: 'a6', word: 'WEEWOO', cells: [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5]] },                 // A9:F9
            { id: 'a8', word: 'AREYYAAR', cells: [[10,2],[10,3],[10,4],[10,5],[10,6],[10,7],[10,8],[10,9]] }, // C11:J11
            { id: 'd12', word: 'YH', cells: [[10,6],[11,6]] },                                         // G11:G12
            { id: 'a9', word: 'HANJI', cells: [[11,6],[11,7],[11,8],[11,9],[11,10]] },                  // G12:K12
            { id: 'd11', word: 'ANDA', cells: [[10,8],[11,8],[12,8],[13,8]] },                          // I11:I14
            { id: 'a10', word: 'ENDEVAAVAY', cells: [[12,6],[12,7],[12,8],[12,9],[12,10],[12,11],[12,12],[12,13],[12,14],[12,15]] } // G13:P13
        ];

        const numMap = {
            '3-1': '1',
            '1-9': '2',
            '5-1': '3',
            '3-7': '7',
            '5-7': '5',
            '5-4': '5d',
            '8-0': '6',
            '10-2': '8',
            '10-6': '12',
            '11-6': '9',
            '10-8': '11',
            '12-6': '10'
        };

        const grid = document.getElementById('grid');
        const map = {};

        for (let r = 0; r < 16; r++) {
            for (let c = 0; c < 19; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;
                grid.appendChild(cell);
            }
        }

        wordList.forEach(w => {
            w.cells.forEach(([r, c]) => {
                const key = `${r}-${c}`;
                let cell = document.getElementById(`cell-${r}-${c}`);
                if (cell) {
                    cell.classList.add('active');
                    
                    if (numMap[key] && !cell.querySelector('.cell-num')) {
                        const numDiv = document.createElement('div');
                        numDiv.className = 'cell-num';
                        numDiv.innerText = numMap[key];
                        cell.appendChild(numDiv);
                    }

                    if (!map[key]) {
                        const input = document.createElement('input');
                        input.maxLength = 1;
                        input.dataset.r = r;
                        input.dataset.c = c;
                        
                        input.addEventListener('input', (e) => {
                            e.target.value = e.target.value.toUpperCase();
                            evaluateGrid();
                            if (e.target.value) {
                                focusNext(r, c);
                            }
                        });

                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Backspace') {
                                if (!e.target.value) {
                                    focusPrev(r, c);
                                }
                                setTimeout(evaluateGrid, 10);
                            } else if (e.key === 'ArrowRight') focusDir(r, c + 1);
                            else if (e.key === 'ArrowLeft') focusDir(r, c - 1);
                            else if (e.key === 'ArrowDown') focusDir(r + 1, c);
                            else if (e.key === 'ArrowUp') focusDir(r - 1, c);
                        });

                        cell.appendChild(input);
                        map[key] = input;
                    }
                }
            });
        });

        function focusNext(r, c) {
            const nextRight = document.querySelector(`input[data-r="${r}"][data-c="${c+1}"]`);
            const nextDown = document.querySelector(`input[data-r="${r+1}"][data-c="${c}"]`);
            if (nextRight) nextRight.focus();
            else if (nextDown) nextDown.focus();
        }

        function focusPrev(r, c) {
            const prevLeft = document.querySelector(`input[data-r="${r}"][data-c="${c-1}"]`);
            const prevUp = document.querySelector(`input[data-r="${r-1}"][data-c="${c}"]`);
            if (prevLeft) prevLeft.focus();
            else if (prevUp) prevUp.focus();
        }

        function focusDir(r, c) {
            const target = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
            if (target) target.focus();
        }

        function toggleHint(id) {
            const hint = document.getElementById(id);
            hint.style.display = hint.style.display === 'block' ? 'none' : 'block';
        }

        function evaluateGrid() {
            document.querySelectorAll('.cell.active').forEach(cell => {
                cell.classList.remove('correct-word', 'wrong-word');
            });
            wordList.forEach(w => {
                const clueEl = document.getElementById(`clue-${w.id}`);
                if (clueEl) clueEl.classList.remove('solved', 'wrong');
            });

            wordList.forEach(w => {
                let currentWord = '';
                let isComplete = true;

                w.cells.forEach(([r, c]) => {
                    const input = map[`${r}-${c}`];
                    const val = input ? input.value.trim().toUpperCase() : '';
                    if (!val) isComplete = false;
                    currentWord += val;
                });

                const clueEl = document.getElementById(`clue-${w.id}`);

                if (currentWord === w.word) {
                    w.cells.forEach(([r, c]) => {
                        const cell = document.getElementById(`cell-${r}-${c}`);
                        if (cell) cell.classList.add('correct-word');
                    });
                    if (clueEl) clueEl.classList.add('solved');
                } else if (isComplete) {
                    w.cells.forEach(([r, c]) => {
                        const cell = document.getElementById(`cell-${r}-${c}`);
                        if (cell && !cell.classList.contains('correct-word')) {
                            cell.classList.add('wrong-word');
                        }
                    });
                    if (clueEl) clueEl.classList.add('wrong');
                }
            });
        }

        function checkAnswers() {
            evaluateGrid();
            let allCorrect = true;

            wordList.forEach(w => {
                let currentWord = '';
                w.cells.forEach(([r, c]) => {
                    const input = map[`${r}-${c}`];
                    currentWord += input ? input.value.trim().toUpperCase() : '';
                });
                if (currentWord !== w.word) allCorrect = false;
            });

            const status = document.getElementById('status-msg');
            if (allCorrect) {
                status.style.color = '#2e7d32';
                status.innerHTML = '🎉 Perfect! Unlocking Stage 2...';
                setTimeout(() => {
                    window.location.href = 'maze.html';
                }, 1500);
            } else {
                status.style.color = '#c62828';
                status.innerText = 'Some words are incorrect or missing!';
            }
        }
    </script>
